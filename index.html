<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物细胞大冒险 · 互动拼装游戏</title>
<style>
  :root {
    --bg1: #eaf6e4;
    --bg2: #d7efd0;
    --ink: #1f3a24;
    --muted: #5b7a62;
    --card: #ffffff;
    --line: #d3e3cf;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 14px; }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: 1px;
  }
  .sub { margin: 0 auto 12px; color: var(--muted); max-width: 620px; line-height: 1.6; }
  .stats {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    font-weight: 600;
  }
  .stats span {
    background: rgba(255,255,255,.72);
    border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px;
    box-shadow: 0 1px 3px rgba(31,58,36,.08);
    font-size: 14px;
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 16px;
    align-items: start;
  }
  .stage {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(31,58,36,.10);
    padding: 8px;
  }
  .stage svg { display: block; width: 100%; height: auto; }
  svg { -webkit-user-select: none; user-select: none; }
  .side { display: flex; flex-direction: column; gap: 14px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(31,58,36,.10);
  }
  .k-empty { color: var(--muted); line-height: 1.7; }
  .k-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .k-emoji { font-size: 30px; }
  .k-name { font-size: 20px; font-weight: 700; }
  .k-tag { font-size: 12px; color: var(--muted); }
  .k-func { margin: 0; line-height: 1.75; color: #2f4734; }
  .k-hintline { font-size: 13px; color: var(--muted); margin-top: 10px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions button {
    flex: 1 1 45%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 10px 8px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  .actions button:hover { background: #f2faf0; transform: translateY(-1px); }
  .actions button:active { transform: translateY(1px); }

  .refbox summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; }
  .refbox img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); }

  .bank {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 18px;
    padding: 16px;
    background: rgba(255,255,255,.55);
    border: 1px dashed #bcd9b2;
    border-radius: 18px;
  }
  .card {
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 2px solid #e2ecdf;
    border-radius: 999px;
    padding: 8px 14px 8px 8px;
    font-size: 16px; font-weight: 700;
    cursor: grab;
    user-select: none;
    touch-action: none;
    box-shadow: 0 2px 6px rgba(31,58,36,.10);
    transition: box-shadow .12s ease, transform .12s ease, opacity .2s ease;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(31,58,36,.16); }
  .card .chip {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: 50%;
    font-size: 20px;
  }
  .card.selected { outline: 3px solid #65a30d; outline-offset: 2px; }
  .card.dragging { opacity: .45; }
  .card.placed { opacity: .45; cursor: default; pointer-events: none; }
  .card.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    opacity: .92;
    box-shadow: 0 10px 24px rgba(31,58,36,.28);
    transform: translate(-50%, -50%) rotate(-2deg) scale(1.05);
  }

  #toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: #233b2a; color: #fff;
    padding: 11px 20px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 1000; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.warn { background: #b45309; }

  .confetti-piece {
    position: fixed; top: -20px;
    width: 10px; height: 16px;
    z-index: 1001; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); }
  }

  .glow { filter: drop-shadow(0 0 7px currentColor); }

  /* cell svg styling */
  .wall { fill: none; stroke: #8d6e63; stroke-width: 11; }
  .cytoplasm { fill: #fef7d9; }
  .membrane { fill: none; stroke: #f59e0b; stroke-width: 3; }
  .vacuole { fill: #cdeafd; stroke: #38bdf8; stroke-width: 2.5; }
  .nucleus { fill: #d9c8fa; stroke: #8b5cf6; stroke-width: 3; }
  .nucleolus { fill: #7c3aed; }
  .chloroplast { fill: #7bd88f; stroke: #1e9e4c; stroke-width: 2; }
  .mitochondria { fill: #f7a8a8; stroke: #d94b4b; stroke-width: 2; }

  .target .leader { stroke: #9db6a0; stroke-width: 2; fill: none; transition: stroke .3s ease; }
  .target .marker { fill: #fff; stroke: #9db6a0; stroke-width: 2.5; transition: all .3s ease; }
  .target .slotRect {
    fill: #fff; stroke: #b6cbb3; stroke-width: 2; stroke-dasharray: 6 5;
    transition: all .3s ease;
  }
  .target .slotHit { fill: transparent; stroke: none; }
  .target .slotText {
    fill: #6b8a70; font-size: 16px; font-weight: 700;
    text-anchor: middle; dominant-baseline: central;
  }
  .target.done .leader { stroke: var(--c); }
  .target.done .marker { fill: var(--c); stroke: var(--c); }
  .target.done .slotRect { fill: var(--light); stroke: var(--c); stroke-dasharray: none; }
  .target.done .slotText { fill: var(--c); font-size: 15px; }
  .target.hint .slotRect { animation: pulse 1s ease infinite; }
  @keyframes pulse {
    0%,100% { stroke: #65a30d; stroke-width: 3; }
    50% { stroke: #a3e635; stroke-width: 6; }
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .bank {
      position: sticky;
      bottom: 8px;
      z-index: 50;
      margin-top: 10px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(6px);
      box-shadow: 0 -4px 16px rgba(31,58,36,.14);
      border: 1px solid #bcd9b2;
      padding: 10px 8px;
      border-radius: 16px;
    }
    .card { padding: 10px 16px 10px 10px; font-size: 17px; min-height: 52px; }
    .card .chip { width: 40px; height: 40px; font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌱 植物细胞大冒险</h1>
    <p class="sub">把下面的细胞结构卡片，拖到（或轻点卡片、再轻点位置）细胞里正确的位置。每放对一个，就能认识它的功能，全部放对你就通关啦！</p>
    <div class="stats">
      <span id="progress">✅ 已放置 0 / 7</span>
      <span id="timer">⏱️ 00:00</span>
      <span id="hintCount">💡 提示 0 次</span>
    </div>
  </header>

  <main>
    <section class="stage">
      <svg viewBox="0 0 940 600" role="img" aria-label="植物细胞结构示意图">
        <!-- 细胞壁（最外层） -->
        <polygon class="wall" id="struct-wall"
          points="180,70 260,55 380,50 520,58 650,70 730,110 745,200 738,320 742,430 680,505 540,540 360,545 230,530 165,470 158,360 162,240 168,140" />
        <!-- 细胞质（细胞膜以内，淡黄色区域） -->
        <polygon class="cytoplasm" id="struct-cytoplasm"
          points="198,88 265,76 378,72 515,80 636,92 708,128 722,205 716,318 720,420 665,484 535,518 362,522 238,508 185,455 178,358 181,238 185,158" />
        <!-- 细胞膜（细胞壁内侧的薄膜） -->
        <polygon class="membrane" id="struct-membrane"
          points="198,88 265,76 378,72 515,80 636,92 708,128 722,205 716,318 720,420 665,484 535,518 362,522 238,508 185,455 178,358 181,238 185,158" />
        <!-- 液泡（大中央液泡） -->
        <path class="vacuole" id="struct-vacuole"
          d="M 400 265 C 398 200 468 176 540 181 C 616 187 646 240 642 305 C 638 376 585 416 510 418 C 436 420 402 342 400 265 Z" />
        <!-- 细胞核 -->
        <circle class="nucleus" id="struct-nucleus" cx="270" cy="300" r="58" />
        <circle class="nucleolus" cx="270" cy="300" r="17" />
        <!-- 叶绿体 -->
        <g class="organelle" id="struct-chloroplast">
          <ellipse class="chloroplast" cx="615" cy="130" rx="34" ry="20" />
          <ellipse class="chloroplast" cx="690" cy="260" rx="30" ry="18" />
          <ellipse class="chloroplast" cx="585" cy="455" rx="30" ry="17" />
        </g>
        <!-- 线粒体 -->
        <g class="organelle" id="struct-mitochondria">
          <ellipse class="mitochondria" cx="610" cy="470" rx="34" ry="17" />
          <ellipse class="mitochondria" cx="235" cy="185" rx="28" ry="14" />
          <ellipse class="mitochondria" cx="320" cy="480" rx="26" ry="13" />
        </g>
        <!-- 虚线定位圈与标签框（由 JS 生成） -->
        <g id="targets"></g>
      </svg>
    </section>

    <aside class="side">
      <div class="panel knowledge" id="knowledge">
        <div class="k-empty" id="kEmpty">
          👆 点击或拖拽一张结构卡片，放到细胞里对应的虚线圆圈处。<br><br>
          放对了，这里会显示它的<b>结构和功能</b>；放错了也没关系，再试试！
        </div>
        <div id="kCard" hidden>
          <div class="k-head">
            <span class="k-emoji" id="kEmoji"></span>
            <span class="k-name" id="kName"></span>
          </div>
          <p class="k-func" id="kFunc"></p>
          <div class="k-hintline" id="kHintLine"></div>
        </div>
      </div>

      <div class="actions">
        <button id="hintBtn">💡 给个提示</button>
        <button id="learnBtn">📖 学习模式</button>
        <button id="resetBtn">🔄 重新开始</button>
      </div>

      `<polyline class="leader" points="${o.point[0]},${o.point[1]} ${endX},${o.slot[1]}"></polyline>` +
      `<circle class="marker" cx="${o.point[0]}" cy="${o.point[1]}" r="9"></circle>` +
      `<rect class="slotHit" x="${o.slot[0]-75}" y="${o.slot[1]-32}" width="150" height="64" rx="24"></rect>` +
      `<rect class="slotRect" x="${o.slot[0]-66}" y="${o.slot[1]-20}" width="132" height="40" rx="20"></rect>` +
      `<text class="slotText" x="${o.slot[0]}" y="${o.slot[1]+1}">${NUM[i]}</text>`;
    g.addEventListener("pointerdown", e => {
      if (selectedCard && !placed.has(selectedCard.dataset.id)) {
        e.preventDefault();
        attemptPlace(selectedCard, g);
      } else if (!selectedCard) {
        toast("先点击或拖动一张结构卡片，再选位置哦～", true);
      }
    });
    targetsG.appendChild(g);
  });

  // ---------- 拖拽 / 点选 ----------
  function onCardPointerDown(e) {
    const card = e.currentTarget;
    if (placed.has(card.dataset.id)) return;
    e.preventDefault();
    setSelected(card);
    drag = { card, moved:false, sx:e.clientX, sy:e.clientY, ghost:null };
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerCancel);
  }

  function onPointerMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 6) {
      drag.moved = true;
      const rect = drag.card.getBoundingClientRect();
      const ghost = drag.card.cloneNode(true);
      ghost.classList.add("ghost");
      ghost.classList.remove("selected");
      ghost.style.width = rect.width + "px";
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.card.classList.add("dragging");
    }
    if (drag.ghost) {
      drag.ghost.style.left = e.clientX + "px";
      drag.ghost.style.top = e.clientY + "px";
    }
  }

  function onPointerUp(e) {
    if (!drag) return;
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    const card = drag.card;
    const moved = drag.moved;
    if (drag.ghost) drag.ghost.remove();
    card.classList.remove("dragging");
    drag = null;

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const target = el && el.closest(".target");
    if (target && target.dataset.id) {
      const cid = moved ? card.dataset.id : (selectedCard ? selectedCard.dataset.id : null);
      if (cid) attemptPlace(moved ? card : selectedCard, target);
    } else if (moved) {
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 420);
      toast("再观察一下这个结构的位置和样子哦～", false);
    } else {
      // 轻点：点在卡片上则选中它，点空白处则取消选择
      const cardUnder = el && el.closest(".card");
      if (cardUnder && !placed.has(cardUnder.dataset.id)) setSelected(cardUnder);
      else setSelected(null);
    }
  }

  function onPointerCancel() {
    if (!drag) return;
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
    window.removeEventListener("pointercancel", onPointerCancel);
    if (drag.ghost) drag.ghost.remove();
    if (drag.card) drag.card.classList.remove("dragging");
    drag = null;
  }

  function setSelected(card) {
    if (selectedCard) selectedCard.classList.remove("selected");
    selectedCard = card;
    if (card) card.classList.add("selected");
  }

  function attemptPlace(card, targetEl) {
    const oid = card.dataset.id;
    const tid = targetEl.dataset.id;
    if (oid === tid) place(card, tid);
    else {
      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 420);
      setSelected(null);
      toast("还差一点点，再想想它应该住在细胞的哪个位置？", true);
    }
  }

  function place(card, oid) {
    if (placed.has(oid)) return;
    placed.add(oid);
    const o = byId(oid);
    const tg = targetsG.querySelector(`.target[data-id="${oid}"]`);
    tg.style.setProperty("--c", o.color);
    tg.style.setProperty("--light", o.light);
    tg.classList.add("done");
    tg.classList.remove("hint");
    tg.querySelector(".slotText").textContent = o.name;

    card.classList.add("placed");
    card.classList.remove("selected");
    card.querySelector(".name").textContent = o.name + " ✓";

    const struct = document.getElementById("struct-" + oid);
    if (struct) {
      struct.classList.add("glow");
      struct.style.color = o.color;
    }
    setSelected(null);
    showKnowledge(o);
    startTimer();
    updateStats();
    toast("🎉 正确！" + o.name + " 归位啦", false);
    if (placed.size === ORGANELLES.length) complete();
  }

  // ---------- 知识卡片 ----------
  function showKnowledge(o, hintMode) {
    kEmpty.hidden = true;
    kCard.hidden = false;
    kEmoji.textContent = o.emoji;
    kName.textContent = hintMode ? "🔍 猜猜这是谁？" : o.name;
    kName.style.color = o.color;
    kFunc.textContent = hintMode ? "线索：" + o.func : o.func;
    kHintLine.textContent = hintMode
      ? "看这条线索，找出对应卡片，拖到刚才闪烁的位置！"
      : "💡 记住：" + o.func.split("。")[0] + "。";
  }

  // ---------- 提示 / 学习 / 重置 ----------
  function hint() {
    if (finished) return;
    const left = ORGANELLES.filter(o => !placed.has(o.id));
    if (!left.length) return;
    const o = left[0];
    const tg = targetsG.querySelector(`.target[data-id="${o.id}"]`);
    tg.classList.add("hint");
    setTimeout(() => tg.classList.remove("hint"), 2400);
    hintsUsed++;
    showKnowledge(o, true);
    updateStats();
    toast("线索已给出，注意看闪烁的位置～", false);
  }

  function learnMode() {
    const list = ORGANELLES.map(o =>
      `<div style="margin:10px 0;padding:10px 12px;border-left:4px solid ${o.color};background:${o.light}55;border-radius:8px;">` +
      `<b>${o.emoji} ${o.name}</b><br><span style="font-size:13px;color:#2f4734;">${o.func}</span></div>`
    ).join("");
    showModal("📖 植物细胞结构一览", list);
  }

  function showModal(title, bodyHtml) {
    let ov = document.getElementById("modalOverlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "modalOverlay";
      ov.style.cssText = "position:fixed;inset:0;background:rgba(20,40,25,.45);display:grid;place-items:center;z-index:1100;padding:20px;";
      ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
      document.body.appendChild(ov);
    }
    ov.innerHTML =
      `<div style="background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);">` +
      `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">` +
      `<h2 style="margin:0;font-size:20px;">${title}</h2>` +
      `<button style="border:none;background:#eef4ee;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;" onclick="this.closest('#modalOverlay').remove()">✕</button>` +
      `</div>${bodyHtml}</div>`;
  }

  function reset() {
    placed.clear();
    finished = false;
    seconds = 0; started = false;
    if (timerId) { clearInterval(timerId); timerId = null; }
    timerEl.textContent = "⏱️ 00:00";
    hintsUsed = 0;
    setSelected(null);
    document.querySelectorAll(".card").forEach(c => {
      c.classList.remove("placed", "selected", "dragging");
      const o = byId(c.dataset.id);
      c.querySelector(".name").textContent = o.name;
    });
    document.querySelectorAll(".target").forEach(tg => {
      tg.classList.remove("done", "hint");
      const idx = ORGANELLES.findIndex(o => o.id === tg.dataset.id);
      tg.querySelector(".slotText").textContent = NUM[idx];
    });
    document.querySelectorAll(".glow").forEach(el => el.classList.remove("glow"));
    kEmpty.hidden = false;
    kCard.hidden = true;
    updateStats();
  }

  // ---------- 统计 / 计时 / 完成 ----------
  function updateStats() {
    progressEl.textContent = "✅ 已放置 " + placed.size + " / 7";
    hintCountEl.textContent = "💡 提示 " + hintsUsed + " 次";
  }
  function startTimer() {
    if (started) return;
    started = true;
    timerId = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, "0");
      const s = String(seconds % 60).padStart(2, "0");
      timerEl.textContent = "⏱️ " + m + ":" + s;
    }, 1000);
  }
  function complete() {
    finished = true;
    if (timerId) { clearInterval(timerId); timerId = null; }
    kEmpty.hidden = true;
    kCard.hidden = false;
    kEmoji.textContent = "🏆";
    kName.textContent = "全部正确！";
    kName.style.color = "#15803d";
    kFunc.textContent = "你成功把植物细胞的 7 个结构都放对了位置，已经认识了它们的结构和功能。";
    kHintLine.textContent = "用时 " + timerEl.textContent.replace("⏱️ ", "") + "，提示 " + hintsUsed + " 次。";
    toast("🎉 通关啦！你太棒了", false);
    spawnConfetti();
  }

  function toast(msg, warn) {
    toastEl.textContent = msg;
    toastEl.className = warn ? "show warn" : "show";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toastEl.className = ""; }, 2200);
  }

  function spawnConfetti() {
    const colors = ["#f43f5e","#f59e0b","#22c55e","#38bdf8","#8b5cf6","#eab308","#ec4899"];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (2 + Math.random() * 2) + "s";
      p.style.animationDelay = Math.random() * 0.6 + "s";
      p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4500);
    }
  }

  document.getElementById("hintBtn").addEventListener("click", hint);
  document.getElementById("learnBtn").addEventListener("click", learnMode);
  document.getElementById("resetBtn").addEventListener("click", reset);

  updateStats();
</script>
</body>
</html>
